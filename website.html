<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Project</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body{font-family:Poppins,sans-serif;margin:0;background:#f6f4fb;color:#2a2730}
    .container{max-width:1000px;margin:auto;padding:20px}
    h1{color:#460365;text-align:center}
    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}
    .gallery img{width:100%;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:0.3s;cursor:pointer}
    .gallery img:hover{transform:scale(1.05)}
    .btn{display:inline-block;margin-top:20px;padding:12px 18px;border-radius:10px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#680b4c,#460365)}
    .back{background:#ccc;color:#000;margin-right:10px}
  </style>
</head>
<body>
  <div class="container">
    <h1>Website Project</h1>
    <p><strong>Technologies:</strong> HTML, CSS, JavaScript, Bootstrap</p>
    <p><strong>Description:</strong> A responsive multi-page website with modern design and user-friendly interface, suitable for desktop and mobile.</p>

    <div class="gallery">
      <img src="website1.png" alt="Website Screenshot 1">
      <img src="website2.png" alt="Website Screenshot 2">
      <img src="website3.png" alt="Website Screenshot 3">
    </div>

    <a class="btn" href="https://github.com/yourusername/website-project" target="_blank"><i class="fa-brands fa-github"></i> View Code</a>
    <a class="btn back" href="portfolio.html">⬅ Back to Portfolio</a>
  </div>

</html>
