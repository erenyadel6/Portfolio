<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ereny — Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root{--card:#ffffff;--ring:rgba(164,80,139,0.25);--bg:#f6f4fb;--text:#2a2730;--accent-1:#a4508b;--accent-2:#5f0a87}
    body{margin:0;font-family:Poppins,system-ui;background:var(--bg);color:var(--text);min-height:100svh;display:grid;place-items:center;padding:24px}
    .wrap{width:100%;max-width:540px;background:var(--card);border:1px solid var(--ring);border-radius:18px;box-shadow:0 10px 24px rgba(0,0,0,.12);padding:22px}
    .head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .avatar{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--accent-1),var(--accent-2));display:grid;place-items:center;color:#fff}
    h1{font-size:20px;margin:0}
    p{margin:0;color:#6a6672}
    .links{display:grid;gap:12px;margin-top:16px}
    .links a{display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;border:1px solid var(--ring);text-decoration:none;color:var(--text);background:#fff}
    .links a:hover{background:linear-gradient(180deg,rgba(164,80,139,.06),rgba(95,10,135,.06))}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="head">
      <div class="avatar"><i class="fa-solid fa-code"></i></div>
      <div>
        <h1>Ereny Adel</h1>
        <p>Find me online</p>
      </div>
    </div>
    <div class="links">
      <a href="https://www.linkedin.com/in/ereny-adel-634212294" target="_blank"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
      <a href="https://github.com/erenyadel6" target="_blank"><i class="fa-brands fa-github"></i> GitHub</a>
      <a href="mailto:erenyadel503@gmail.com"><i class="fa-solid fa-envelope"></i> Email</a>
      <!-- Add more: e.g., <a href="#"><i class="fa-brands fa-x-twitter"></i> Twitter</a> -->
    </div>
  </main>
</body>
</html>
